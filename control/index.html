<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise Sea Express — Dispatch</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login-card">
    <h1 class="brand">Paradise<strong>Sea Express</strong></h1>
    <p class="muted">Dispatch — staff sign in</p>
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    <p id="loginError" class="err"></p>
  </form>
</div>

<!-- DASHBOARD -->
<div id="dashView" class="dash" style="display:none">
  <header class="topbar">
    <h1 class="brand">Paradise<strong>Sea Express</strong> <span class="muted">· Dispatch</span></h1>
    <div class="topbar-right">
      <span id="liveStatus" class="live-status"></span>
      <span id="whoami" class="muted"></span>
      <button id="refreshBtn" class="btn btn-ghost btn-sm">Refresh</button>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="view-tabs" id="viewTabs">
      <button data-view="bookings" class="vtab active">Bookings</button>
      <button data-view="clients" class="vtab">Clients</button>
      <button data-view="boats" class="vtab">Boats</button>
      <button data-view="payout" class="vtab">Payout</button>
    </div>
    <span id="countInfo" class="muted"></span>
  </div>

  <div class="toolbar" id="bookingFilters">
    <div class="filter-tabs" id="filterTabs">
      <button data-filter="active" class="tab active">Active</button>
      <button data-filter="all" class="tab">All</button>
      <button data-filter="completed" class="tab">Completed</button>
      <button data-filter="cancelled" class="tab">Cancelled</button>
    </div>
  </div>

  <div id="bookingsWrap" class="bookings-wrap">
    <div id="bookingsBody" class="cards-list"></div>
    <div id="emptyState" class="empty-state" style="display:none">No bookings yet.</div>
  </div>

  <div id="clientsWrap" style="display:none">
    <input id="clientSearch" class="client-search" type="search"
           placeholder="Search by name or number" autocomplete="off">
    <div id="clientsBody" class="cards-list"></div>
    <div id="clientsEmpty" class="empty-state" style="display:none">No clients yet.</div>
  </div>

  <div id="boatsWrap" style="display:none">
    <div id="boatsBody" class="cards-list"></div>
    <div id="boatsEmpty" class="empty-state" style="display:none">No boats yet.</div>
  </div>

  <div id="payoutWrap" style="display:none">
    <div class="week-bar">
      <button type="button" id="weekPrev" class="week-nav" aria-label="Earlier week">‹</button>
      <div class="week-label">
        <div id="weekRange"></div>
        <div id="weekPayday" class="week-payday"></div>
      </div>
      <button type="button" id="weekNext" class="week-nav" aria-label="Later week">›</button>
    </div>
    <div id="payoutTotals" class="payout-totals"></div>
    <div id="payoutBody" class="cards-list"></div>
    <div id="payoutEmpty" class="empty-state" style="display:none">No completed trips this week.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1/bundle/libphonenumber-min.js"></script>
<script src="script.js"></script>
</body>
</html>
